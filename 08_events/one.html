<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>htnml Events </title>
</head>
<body style="background-color: #414141; color: aliceblue;">
    <h2>Amazing image</h2>
    <div >
        <ul id="images">
            <li><img width="200px" id="photoshop" src="https://images.pexels.com/photos/3561339/pexels-photo-3561339.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt="photoshop"></li>
            <li><img width="200px" id="japan" src="https://images.pexels.com/photos/3532553/pexels-photo-3532553.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt=""></li>
            <li><img width="200px" id="river" src="https://images.pexels.com/photos/3532551/pexels-photo-3532551.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt=""></li>
            <li><img width="200px" id="owl" src="https://images.pexels.com/photos/3532552/pexels-photo-3532552.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt="" ></li>
            <li><img width="200px" id="prayer" src="https://images.pexels.com/photos/2522671/pexels-photo-2522671.jpeg?auto=compress&cs=tinysrgb&w=1600&lazy=load" alt=""></li>
            <li><a style="color: aliceblue;" href="https://google.com" id="google">Google</a></li>
        </ul>
   </div>
</body>
<script>  //NOTE : js m jitne bhi events h sequentially occur hote h
    document.getElementById('owl').onclick = function(){
        alert("owl clicked")  //also not a good way
    }

     attachEvent() //ye bhi purana method h for events
    jQuery - on // ye bhi

    // type, timestamp, defaultPrevented
    // target, toElement, srcElement, currentTarget,
    // clientX, clientY, screenX, screenY
    // altkey, ctrlkey, shiftkey, keyCode

    document.getElementById('images').addEventListener('click', function(e){ //e is event object
        console.log("clicked inside the ul");//ye print hoga jab images pe click kroge and jo neeche h vo tab hoga jab owl pe click krenge , agar owl pe click krenge tab ul bhi activate hoga kyuki li bhi to ul k andar h. it is called bubbling(event proportion),, agar false ki jagah dono jagah true krdenge to phle clicked inside ul aayega then owl clicked aayega isko bolte h event captured
    }, false)

    document.getElementById('owl').addEventListener('click', function(e){ //best way is eventlistener usme function likho aur ek default hota h false
        console.log("owl clicked");
        e.stopPropagation() //ab bubble hoke upar nhi jayega
    }, false)
    
    document.getElementById('google').addEventListener('click',function(e){
        e.preventDefault();//isse google open nhi hoga bss likh k aayega google clicked
        e.stopPropagation()
        console.log("google clicked");
    }, false)
   
    //agar images pe click kre to image gayab ho jaae
    document.querySelector('#images').addEventListener('click', function(e){
        console.log(e.target.tagName); //jo target aa rha h click krne pe uska tagname lelo kyuki agar uska parentnode liya aur agar humne google pe click krdiya to sab images gayab ho jayengi kyuki uska parentnode gayab ho jayega to use tagname
        if (e.target.tagName === 'IMG') { //agar targetname IMG aaya tabhi remove hongi images kyuki google pe click krne pe li aayega tagname
            console.log(e.target.id);
            let removeIt = e.target.parentNode
            removeIt.remove()
        }
    
        
    })
    
    //removeIt.parentNode.removeChild(removeIt) //another way to remove
</script>
</html>
